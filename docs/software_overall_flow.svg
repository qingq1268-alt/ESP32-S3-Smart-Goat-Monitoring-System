<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">LXSPI 软件整体流程图</title>
  <desc id="desc">展示模型训练部署、ESP32-S3 实时采集推理、UDP 通信、PC 和 Android 端显示存储以及控制命令回传流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#9a3412"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .band-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .node-blue { fill: #eff6ff; stroke: #3b82f6; }
      .node-green { fill: #f0fdf4; stroke: #22c55e; }
      .node-orange { fill: #fff7ed; stroke: #f97316; }
      .node-purple { fill: #f5f3ff; stroke: #8b5cf6; }
      .node-red { fill: #fef2f2; stroke: #ef4444; }
      .decision { fill: #ffffff; stroke: #f97316; stroke-width: 1.7; }
      .text { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #166534; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .edge-orange { fill: none; stroke: #9a3412; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1120"/>
  <text class="title" x="750" y="46" text-anchor="middle">山羊行为智能监测系统软件整体流程图</text>
  <text class="subtitle" x="750" y="74" text-anchor="middle">训练部署支线 + 佩戴端实时推理主线 + 上位机/移动端显示存储 + 控制命令回传</text>

  <rect x="52" y="105" width="260" height="925" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="band-title" x="182" y="135" text-anchor="middle">模型训练与部署</text>

  <rect x="385" y="105" width="455" height="925" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text class="band-title" x="612" y="135" text-anchor="middle">ESP32-S3 佩戴端</text>

  <rect x="930" y="105" width="505" height="925" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="band-title" x="1182" y="135" text-anchor="middle">PC 上位机 / Android 监控端</text>

  <g id="training">
    <rect class="node node-purple" x="92" y="170" width="180" height="58" rx="8"/>
    <text class="text" x="182" y="194" text-anchor="middle">历史加速度数据集</text>
    <text class="small" x="182" y="215" text-anchor="middle">X/Y/Z 标签数据</text>

    <rect class="node node-purple" x="92" y="270" width="180" height="66" rx="8"/>
    <text class="text" x="182" y="294" text-anchor="middle">数据预处理</text>
    <text class="small" x="182" y="315" text-anchor="middle">划分训练/验证/测试集</text>

    <rect class="node node-purple" x="92" y="380" width="180" height="58" rx="8"/>
    <text class="text" x="182" y="404" text-anchor="middle">CNN 模型训练</text>
    <text class="small" x="182" y="425" text-anchor="middle">五类行为识别</text>

    <rect class="node node-purple" x="92" y="480" width="180" height="58" rx="8"/>
    <text class="text" x="182" y="504" text-anchor="middle">导出 ONNX</text>
    <text class="small" x="182" y="525" text-anchor="middle">生成归一化参数</text>

    <rect class="node node-purple" x="92" y="580" width="180" height="66" rx="8"/>
    <text class="text" x="182" y="604" text-anchor="middle">INT8 量化</text>
    <text class="small" x="182" y="625" text-anchor="middle">生成 ESP-DL 模型</text>

    <rect class="node node-purple" x="92" y="700" width="180" height="66" rx="8"/>
    <text class="text" x="182" y="724" text-anchor="middle">部署到固件</text>
    <text class="small" x="182" y="745" text-anchor="middle">.espdl + model_norm.h</text>

    <path class="edge" d="M182,228 L182,270"/>
    <path class="edge" d="M182,336 L182,380"/>
    <path class="edge" d="M182,438 L182,480"/>
    <path class="edge" d="M182,538 L182,580"/>
    <path class="edge" d="M182,646 L182,700"/>
  </g>

  <g id="device">
    <rect class="node node-blue" x="505" y="165" width="215" height="66" rx="8"/>
    <text class="text" x="612.5" y="190" text-anchor="middle">ESP32-S3 固件初始化</text>
    <text class="small" x="612.5" y="211" text-anchor="middle">NVS / WiFi / SD / 模型 / UDP</text>

    <rect class="node node-blue" x="430" y="290" width="175" height="66" rx="8"/>
    <text class="text" x="517.5" y="315" text-anchor="middle">LSM6DSO 传感器</text>
    <text class="small" x="517.5" y="336" text-anchor="middle">三轴加速度采集</text>

    <rect class="node node-blue" x="635" y="290" width="160" height="66" rx="8"/>
    <text class="text" x="715" y="315" text-anchor="middle">采集加速度数据</text>
    <text class="small" x="715" y="336" text-anchor="middle">约 26 Hz</text>

    <rect class="node node-blue" x="430" y="420" width="175" height="58" rx="8"/>
    <text class="text" x="517.5" y="445" text-anchor="middle">SD 卡记录</text>
    <text class="small" x="517.5" y="466" text-anchor="middle">原始数据 CSV</text>

    <rect class="node node-blue" x="635" y="420" width="160" height="58" rx="8"/>
    <text class="text" x="715" y="445" text-anchor="middle">重采样</text>
    <text class="small" x="715" y="466" text-anchor="middle">26 Hz → 24.4 Hz</text>

    <rect class="node node-blue" x="635" y="530" width="160" height="58" rx="8"/>
    <text class="text" x="715" y="555" text-anchor="middle">滑动窗口</text>
    <text class="small" x="715" y="576" text-anchor="middle">120 点输入</text>

    <rect class="node node-blue" x="635" y="640" width="160" height="58" rx="8"/>
    <text class="text" x="715" y="665" text-anchor="middle">CNN 行为识别</text>
    <text class="small" x="715" y="686" text-anchor="middle">ESP-DL 推理</text>

    <rect class="node node-blue" x="635" y="750" width="160" height="76" rx="8"/>
    <text class="text" x="715" y="776" text-anchor="middle">生成行为结果</text>
    <text class="small" x="715" y="797" text-anchor="middle">类别 / 置信度</text>
    <text class="small" x="715" y="816" text-anchor="middle">电量 / SD 状态</text>

    <path class="decision" d="M495,608 L555,558 L615,608 L555,658 Z"/>
    <text class="text" x="555" y="599" text-anchor="middle">是否打开</text>
    <text class="text" x="555" y="619" text-anchor="middle">波形流?</text>

    <rect class="node node-orange" x="430" y="735" width="175" height="58" rx="8"/>
    <text class="text" x="517.5" y="760" text-anchor="middle">UDP 5007</text>
    <text class="small" x="517.5" y="781" text-anchor="middle">发送加速度波形</text>

    <rect class="node node-orange" x="430" y="835" width="175" height="58" rx="8"/>
    <text class="text" x="517.5" y="860" text-anchor="middle">状态心跳</text>
    <text class="small" x="517.5" y="881" text-anchor="middle">波形关闭时发送</text>

    <path class="edge" d="M272,733 L505,206"/>
    <path class="edge" d="M612.5,231 L612.5,255 L517.5,255 L517.5,290"/>
    <path class="edge" d="M605,323 L635,323"/>
    <path class="edge" d="M715,356 L715,420"/>
    <path class="edge" d="M635,449 L605,449"/>
    <path class="edge" d="M715,478 L715,530"/>
    <path class="edge" d="M715,588 L715,640"/>
    <path class="edge" d="M715,698 L715,750"/>
    <path class="edge-orange" d="M635,323 C560,390 553,485 555,558"/>
    <path class="edge-orange" d="M555,658 L555,710 L517.5,710 L517.5,735"/>
    <text class="label" x="535" y="704" text-anchor="middle">是</text>
    <path class="edge-orange" d="M495,608 L470,608 L470,835"/>
    <text class="label" x="478" y="598" text-anchor="middle">否</text>
  </g>

  <g id="client">
    <rect class="node node-green" x="1000" y="290" width="230" height="76" rx="8"/>
    <text class="text" x="1115" y="316" text-anchor="middle">PC 上位机 / Android 端</text>
    <text class="small" x="1115" y="337" text-anchor="middle">监听 UDP 5005 / 5007</text>
    <text class="small" x="1115" y="356" text-anchor="middle">解析 JSON 数据包</text>

    <rect class="node node-green" x="985" y="455" width="185" height="76" rx="8"/>
    <text class="text" x="1077.5" y="481" text-anchor="middle">实时显示</text>
    <text class="small" x="1077.5" y="502" text-anchor="middle">行为 / 波形</text>
    <text class="small" x="1077.5" y="521" text-anchor="middle">电量 / SD 状态</text>

    <rect class="node node-green" x="1210" y="455" width="185" height="76" rx="8"/>
    <text class="text" x="1302.5" y="481" text-anchor="middle">统计分析</text>
    <text class="small" x="1302.5" y="502" text-anchor="middle">行为占比</text>
    <text class="small" x="1302.5" y="521" text-anchor="middle">健康风险提示</text>

    <rect class="node node-green" x="1095" y="610" width="190" height="66" rx="8"/>
    <text class="text" x="1190" y="635" text-anchor="middle">SQLite 历史存储</text>
    <text class="small" x="1190" y="656" text-anchor="middle">本地历史数据</text>

    <rect class="node node-red" x="1035" y="790" width="250" height="86" rx="8"/>
    <text class="text" x="1160" y="816" text-anchor="middle">UDP 6006 控制命令</text>
    <text class="small" x="1160" y="838" text-anchor="middle">START / PAUSE / ACCELON / ACCELOFF</text>
    <text class="small" x="1160" y="858" text-anchor="middle">MOUNT / SYNC / RESET</text>

    <path class="edge-green" d="M795,788 C870,788 910,328 1000,328"/>
    <text class="label" x="883" y="759">UDP 5005 行为结果</text>
    <path class="edge-green" d="M605,764 C770,764 830,328 1000,328"/>
    <text class="label" x="735" y="722">UDP 5007 波形</text>
    <path class="edge-green" d="M605,864 C800,864 860,350 1000,350"/>
    <text class="label" x="735" y="840">状态心跳</text>

    <path class="edge" d="M1115,366 L1115,455"/>
    <path class="edge" d="M1160,366 C1220,390 1280,408 1302.5,455"/>
    <path class="edge" d="M1077.5,531 C1085,575 1130,595 1190,610"/>
    <path class="edge" d="M1302.5,531 C1290,575 1245,595 1190,610"/>
    <path class="edge-orange" d="M1035,833 C870,835 780,250 720,198"/>
    <text class="label" x="870" y="812">控制回传</text>
  </g>
</svg>
